[project]
name = "meu-cinema-organizado"
version = "0.1.0"
description = "API para organizar meu catálogo de filmes, feita com FastAPI"
authors = [
    {name = "Geovana"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
